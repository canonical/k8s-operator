name: Re-run transient CI failures

on:
  workflow_run:
    workflows:
      - Integration tests
      - Integration tests (Jubilant)
      - Nightly Tests
      - Weekly Tests
    types: [completed]

permissions:
  actions: write

concurrency:
  group: rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Re-run failed jobs when failures look transient
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        DRY_RUN: "false"
        TRANSIENT_PATTERNS: >-
          store server returned status (408|429|5[0-9][0-9])|unexpected http response code \((408|429|5[0-9][0-9])\)|cannot get nonce from store|ContentLength=[0-9]+ with Body length 0|cannot deploy controller application|unable to contact snap store|TLS handshake timeout|Temporary failure in name resolution|Network is unreachable|HTTP Error (429|5[0-9][0-9])|Too Many Requests|The runner has received a shutdown signal|lost communication with the server
      run: |-
        set -euo pipefail

        gh_api() {
          local attempt
          for attempt in 1 2 3 4 5; do
            if gh api "$@"; then
              return 0
            fi
            sleep $((attempt * 10))
          done
          return 1
        }

        FAILED_JOBS=()
        PAGE=1
        while :; do
          PAGE_JSON=$(gh_api "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=20&page=${PAGE}")
          while IFS= read -r LINE; do
            [[ -n "${LINE}" ]] && FAILED_JOBS+=("${LINE}")
          done < <(jq -r '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' <<< "${PAGE_JSON}")
          if (( $(jq '.jobs | length' <<< "${PAGE_JSON}") < 20 )); then
            break
          fi
          PAGE=$((PAGE + 1))
        done

        if (( ${#FAILED_JOBS[@]} == 0 )); then
          echo "No failed jobs found in ${RUN_URL} attempt ${RUN_ATTEMPT}"
          exit 0
        fi

        TRANSIENT=()
        LOG_FILE=$(mktemp)
        for ENTRY in "${FAILED_JOBS[@]}"; do
          JOB_ID=${ENTRY%%$'\t'*}
          JOB_NAME=${ENTRY#*$'\t'}
          if ! gh_api "repos/${REPO}/actions/jobs/${JOB_ID}/logs" > "${LOG_FILE}" 2>/dev/null; then
            echo "Could not fetch logs for: ${JOB_NAME}"
            continue
          fi
          if MATCH=$(grep -m1 -oE "${TRANSIENT_PATTERNS}" "${LOG_FILE}"); then
            MATCH=${MATCH%%$'\n'*}
            echo "::notice title=Transient failure::${JOB_NAME}: ${MATCH}"
            TRANSIENT+=("${JOB_NAME}: ${MATCH}")
          else
            echo "Non-transient failure: ${JOB_NAME}"
          fi
        done

        if (( ${#TRANSIENT[@]} == 0 )); then
          echo "No transient failures detected; not re-running ${RUN_URL}"
          exit 0
        fi

        {
          echo "### Re-running failed jobs of ${RUN_URL}"
          echo
          echo "Transient failures detected in attempt ${RUN_ATTEMPT}:"
          printf -- '- %s\n' "${TRANSIENT[@]}"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

        if [[ "${DRY_RUN}" == "true" ]]; then
          echo "DRY_RUN: would run gh run rerun ${RUN_ID} --failed"
          exit 0
        fi
        gh run rerun "${RUN_ID}" --repo "${REPO}" --failed
