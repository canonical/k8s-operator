name: Charm Analysis
# Unit testing, Style Linting, Type Linting, Static Analysis, and Spelling

on:
  pull_request:

jobs:
  unit-tests:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@4d79d7d1a65c8f4b9afc6d52bff8d7f00aeb4ce2 # main
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.12'
    with:
      charm-directory: charms
      self-hosted-runner:  false
      with-uv: true
      python-version: ${{ matrix.python-version }}
