name: integration-test
description: |-
  Used to deploy or refresh within an integration test model
default-base: ubuntu@24.04
applications:
  k8s:
    charm: k8s
    num_units: 1
    constraints: cores=2 mem=8G root-disk=16G
    expose: true
    options:
      bootstrap-datastore: managed-etcd
  # Hosts the COS stack. Pinned to a published channel (not the local build) so a
  # regression in the charm under test cannot take the observability stack down with it.
  cos-host:
    charm: k8s
    channel: 1.35/stable
    num_units: 1
    constraints: cores=4 mem=8G root-disk=40G
